<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Flow - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="todo.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-logo">
            <h2>Task Flow</h2>
        </div>
        <div class="nav-links">
            <ul class="links-list">
                <li><a href="/">Home</a></li>
                <li><a href="todo.html">Dashboard</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Features</a></li>
                <li>
                    <button class="get-started-button" aria-expanded="false">
                        Get Started
                    </button>
                    <ul class="dropdown-menu" aria-label="Get Started">
                        <li><a href="#">Sign Up</a></li>
                        <li><a href="#">Login</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Main Todo Container -->
    <div class="todo-container">
        <div class="app-container">
            <!-- Header -->
            <div class="app-header">
                <h1>My Tasks</h1>
                <p class="task-subtitle">Manage your daily tasks efficiently</p>
                <p class="task-added"><span id="task-count">0</span> Task Added</p>
            </div>

            <!-- Add Task Input Section -->
            <div class="input-section">
                <input type="text" id="task-input" class="task-input" placeholder="Add a new task..." />
                <button id="add-btn" class="add-btn">Add Task</button>
            </div>

            <!-- Task List Container -->
            <div class="list-container">
                <ul class="task-list" id="task-list">
                    <!-- Tasks will be added here -->
                </ul>
                <div class="empty-state" id="empty-state">
                    <p>No tasks yet. Start by adding one! 📝</p>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button class="clear-btn" id="clear-btn">Clear Completed</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>Developed by justice</p>
        <p>&copy; <span id="date"></span> All Rights Reserved!</p>
    </footer>
    <script src="todo.js"></script>
</body>
</html>
